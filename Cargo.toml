[package]
name = "whassup_george"
version = "0.1.0"
edition = "2024"

[dependencies]
rss = "2.0"
reqwest = { version = "0.12", features = ["blocking"] }
serde_json = "1.0.151"
serde = { version = "1.0", features = ["derive"] }
lettre = { version = "0.11.23", default-features = false, features = [
    "builder",
    "smtp-transport",
    "rustls-tls",
] }
